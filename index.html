<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dema Couders</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23233a80'/%3E%3Ctext x='32' y='45' font-family='Georgia,serif' font-size='40' text-anchor='middle' fill='white'%3EC%3C/text%3E%3C/svg%3E">
<style>
:root { --bg: #f4f6fb; --surface: #fff; --fg: #151b2f; --muted: #586181; --line: #d7dcea; --ink: #233a80; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg: #0e1322; --surface: #151b2e; --fg: #e7eaf4; --muted: #9ba4c4; --line: #2a3354; --ink: #92aaff; color-scheme: dark; } }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
main { max-width: 680px; margin: 0 auto; padding: 56px max(16px, env(safe-area-inset-left, 0px)) 56px max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px; }
h1 { font: 600 28px/1.2 Georgia, "Times New Roman", serif; margin: 0; }
p { margin: 0; color: var(--muted); }
a.demo { display: grid; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; color: inherit; text-decoration: none; }
a.demo:hover { border-color: var(--ink); }
a.demo strong { color: var(--ink); }
</style>
</head>
<body>
<main>
<h1>Dema Couders</h1>
<p>Działające przykłady systemów, które budujemy dla firm.</p>
<a class="demo" href="/tlumaczenia/"><strong>Wycena tłumaczeń przysięgłych</strong><span>Klient wgrywa skan, system odczytuje tekst, liczy strony rozliczeniowe i podaje cenę z terminem, a biuro dostaje opłacone zlecenie.</span></a>
</main>
</body>
</html>
